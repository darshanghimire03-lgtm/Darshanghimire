<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="JZtyb078dbEx1xQOkxxzVD-k_gqM2mh-_Dn59hmJMJM" />
    <title>🎉 Happy Birthday Animation 🎂</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #0a0f1e 0%, #1a1f2f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* main card / canvas container */
        .birthday-card {
            position: relative;
            width: 100%;
            max-width: 900px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        /* floating balloons layer */
        .balloons {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .balloon {
            position: absolute;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            opacity: 0.8;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3), inset -5px -10px 15px rgba(0,0,0,0.2), inset 10px 10px 20px rgba(255,255,255,0.4);
            animation: floatBalloon 12s infinite ease-in-out;
            transform-origin: center;
            will-change: transform, top;
        }

        .balloon::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 40px;
            background: linear-gradient(to bottom, #ffffffaa, #ffffff00);
            border-radius: 2px;
            filter: drop-shadow(0 0 2px rgba(255,255,255,0.5));
        }

        /* Different balloon colors, sizes, positions and delays */
        .b1 { width: 90px; height: 110px; background: radial-gradient(circle at 30% 30%, #ff6b6b, #c0392b); left: 5%; top: 10%; animation-duration: 14s; animation-delay: 0s; }
        .b2 { width: 70px; height: 85px; background: radial-gradient(circle at 30% 30%, #f7dc6f, #d4ac0d); left: 20%; top: 60%; animation-duration: 16s; animation-delay: 2s; }
        .b3 { width: 110px; height: 130px; background: radial-gradient(circle at 30% 30%, #a9dfbf, #1e8449); left: 80%; top: 15%; animation-duration: 18s; animation-delay: 1s; }
        .b4 { width: 80px; height: 95px; background: radial-gradient(circle at 30% 30%, #aed6f1, #2471a3); left: 70%; top: 70%; animation-duration: 13s; animation-delay: 3s; }
        .b5 { width: 100px; height: 120px; background: radial-gradient(circle at 30% 30%, #d7bde2, #7d3c98); left: 45%; top: 5%; animation-duration: 17s; animation-delay: 0.5s; }
        .b6 { width: 65px; height: 80px; background: radial-gradient(circle at 30% 30%, #f5b7b1, #b03a2e); left: 90%; top: 45%; animation-duration: 15s; animation-delay: 4s; }
        .b7 { width: 85px; height: 100px; background: radial-gradient(circle at 30% 30%, #f9e79f, #b7950b); left: 10%; top: 80%; animation-duration: 20s; animation-delay: 2.5s; }
        .b8 { width: 75px; height: 90px; background: radial-gradient(circle at 30% 30%, #f0b27a, #a04000); left: 55%; top: 85%; animation-duration: 14s; animation-delay: 1.5s; }

        /* Birthday text with 3D and glow */
        .greeting {
            position: relative;
            z-index: 20;
            text-align: center;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.7), 0 0 40px #ffaa00, 0 0 80px #ff8800;
            animation: textPop 1.8s cubic-bezier(0.2, 0.9, 0.3, 1.2) forwards;
            transform-origin: center;
            margin-bottom: 20px;
            pointer-events: none;
        }

        .greeting h1 {
            font-size: clamp(3rem, 12vw, 6rem);
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #ffe066, #ffb347, #ff7b00, #ffd966);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(255, 200, 0, 0.8), 0 0 60px rgba(255, 100, 0, 0.5);
            animation: shine 3s infinite alternate;
            line-height: 1.2;
        }

        .greeting .sub {
            font-size: clamp(1rem, 4vw, 1.8rem);
            letter-spacing: 6px;
            margin-top: 10px;
            font-weight: 300;
            color: #f0e6d2;
            text-shadow: 0 0 20px #ffaa33, 0 0 40px #ff7700;
            opacity: 0;
            animation: fadeInUp 1s 0.6s forwards;
        }

        /* Cake container */
        .cake-container {
            position: relative;
            z-index: 25;
            margin-top: 30px;
            animation: cakeRise 1.2s ease-out;
            filter: drop-shadow(0 20px 25px rgba(0,0,0,0.6));
        }

        .cake {
            position: relative;
            width: 300px;
            height: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
        }

        /* Cake layers */
        .layer {
            border-radius: 20px 20px 12px 12px;
            box-shadow: inset 0 -5px 0 rgba(0,0,0,0.1), 0 8px 0 #8b4513, 0 12px 15px rgba(0,0,0,0.3);
            position: relative;
            border: 2px solid rgba(255,255,255,0.2);
            background: radial-gradient(circle at 30% 20%, #f7d9aa, #e0a86b);
        }

        .layer-bottom {
            width: 280px;
            height: 75px;
            background: linear-gradient(145deg, #d98c5f, #b5653b);
            border-radius: 20px 20px 12px 12px;
            box-shadow: inset 0 -8px 0 #7a3e1a, 0 10px 0 #6b3a1a, 0 15px 20px black;
            border-bottom: 4px solid #ffcf9a;
        }

        .layer-middle {
            width: 240px;
            height: 65px;
            background: linear-gradient(145deg, #f7c58b, #d89c5b);
            border-radius: 18px 18px 10px 10px;
            margin-bottom: 5px;
            box-shadow: inset 0 -5px 0 #b5723a, 0 7px 0 #8b4e1f, 0 10px 15px rgba(0,0,0,0.3);
            border-bottom: 3px solid #ffdbb5;
        }

        .layer-top {
            width: 200px;
            height: 55px;
            background: linear-gradient(145deg, #ffe0b0, #f5b87c);
            border-radius: 16px 16px 8px 8px;
            margin-bottom: 5px;
            box-shadow: inset 0 -4px 0 #c28a4a, 0 5px 0 #a05e28, 0 8px 12px rgba(0,0,0,0.3);
            border-bottom: 2px solid #fff0d0;
        }

        /* Frosting drips */
        .drip {
            position: absolute;
            width: 18px;
            height: 25px;
            background: #fff0d0;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 3px 5px rgba(0,0,0,0.2);
            top: -8px;
            z-index: 5;
        }

        .drip1 { left: 15px; height: 30px; width: 20px; background: #ffe9c7; }
        .drip2 { left: 60px; height: 22px; width: 16px; background: #ffdead; }
        .drip3 { left: 110px; height: 28px; width: 22px; background: #ffe9c7; }
        .drip4 { left: 165px; height: 20px; width: 18px; background: #ffdead; }
        .drip5 { left: 210px; height: 32px; width: 20px; background: #ffe9c7; }
        .drip6 { left: 255px; height: 24px; width: 18px; background: #ffdead; }

        /* Candles */
        .candle {
            position: relative;
            width: 12px;
            height: 60px;
            background: linear-gradient(45deg, #f5f5f5, #dcdcdc);
            border-radius: 6px 6px 2px 2px;
            margin: 0 6px;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3), inset -2px -2px 4px rgba(0,0,0,0.2);
            z-index: 30;
            transform-origin: bottom;
            animation: candleFlicker 0.3s infinite alternate;
        }

        .candle::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 10px;
            background: #ffb347;
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 12px #ffaa00, 0 0 25px #ff8800, 0 0 40px #ff4400;
            animation: flameFlicker 0.2s infinite alternate;
        }

        .candle::after {
            content: '';
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 20px;
            background: linear-gradient(to bottom, #ffae42, #ff7b00, transparent);
            border-radius: 50%;
            filter: blur(2px);
            opacity: 0.8;
            animation: flameGlow 0.15s infinite alternate;
        }

        .candles {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 5px;
            z-index: 35;
            position: relative;
            top: 15px;
        }

        /* Small flames layer for extra glow */
        .flame {
            position: absolute;
            width: 14px;
            height: 18px;
            background: radial-gradient(circle, #ffffaa, #ffaa00, #ff5500);
            border-radius: 50% 50% 20% 20%;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            filter: blur(1px);
            box-shadow: 0 0 20px #ffaa00, 0 0 35px #ff6600;
            animation: flameFlicker 0.12s infinite alternate;
            pointer-events: none;
        }

        /* Confetti pieces (JS generated) */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #f1c40f;
            opacity: 0.9;
            top: -10px;
            z-index: 100;
            pointer-events: none;
            border-radius: 2px;
            animation: fall linear forwards;
        }

        /* Animations */
        @keyframes floatBalloon {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(5deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        @keyframes textPop {
            0% { transform: scale(0.2); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shine {
            0% { text-shadow: 0 0 30px #ffaa00, 0 0 60px #ff5500, 0 0 100px #ff2200; }
            100% { text-shadow: 0 0 40px #ffffaa, 0 0 80px #ffaa00, 0 0 120px #ff6600; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes cakeRise {
            0% { transform: translateY(80px) scale(0.7); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        @keyframes candleFlicker {
            0% { transform: scaleY(1) rotate(-0.5deg); }
            100% { transform: scaleY(1.02) rotate(0.5deg); }
        }

        @keyframes flameFlicker {
            0% { transform: translateX(-50%) scale(1); opacity: 0.9; }
            100% { transform: translateX(-50%) scale(1.2); opacity: 1; }
        }

        @keyframes flameGlow {
            0% { opacity: 0.6; filter: blur(2px); }
            100% { opacity: 1; filter: blur(3px); }
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .cake { width: 260px; height: 200px; }
            .layer-bottom { width: 240px; height: 65px; }
            .layer-middle { width: 200px; height: 55px; }
            .layer-top { width: 170px; height: 48px; }
            .drip { transform: scale(0.9); }
            .candle { height: 50px; width: 10px; }
            .balloon { transform: scale(0.8); }
        }
    </style>
</head>
<body>
    <div class="birthday-card">
        <!-- Floating balloons -->
        <div class="balloons">
            <div class="balloon b1"></div>
            <div class="balloon b2"></div>
            <div class="balloon b3"></div>
            <div class="balloon b4"></div>
            <div class="balloon b5"></div>
            <div class="balloon b6"></div>
            <div class="balloon b7"></div>
            <div class="balloon b8"></div>
        </div>

        <!-- Greeting text -->
        <div class="greeting">
            <h1>HAPPY BIRTHDAY</h1>
            <div class="sub">✨ Make a wish ✨</div>
        </div>

        <!-- Cake -->
        <div class="cake-container">
            <div class="cake">
                <!-- Candles -->
                <div class="candles">
                    <div class="candle"><div class="flame"></div></div>
                    <div class="candle"><div class="flame"></div></div>
                    <div class="candle"><div class="flame"></div></div>
                    <div class="candle"><div class="flame"></div></div>
                </div>

                <!-- Cake layers -->
                <div class="layer layer-top" style="position: relative;">
                    <!-- drips on top layer -->
                    <div class="drip drip1" style="left: 15px; top: -8px; height: 25px; width: 18px;"></div>
                    <div class="drip drip2" style="left: 60px; top: -8px; height: 20px; width: 16px;"></div>
                    <div class="drip drip3" style="left: 120px; top: -8px; height: 28px; width: 22px;"></div>
                    <div class="drip drip4" style="left: 170px; top: -8px; height: 22px; width: 18px;"></div>
                </div>
                
                <div class="layer layer-middle" style="position: relative;">
                    <div class="drip" style="left: 20px; top: -8px; height: 28px; width: 20px; background: #ffe9c7;"></div>
                    <div class="drip" style="left: 70px; top: -8px; height: 24px; width: 18px; background: #ffdead;"></div>
                    <div class="drip" style="left: 130px; top: -8px; height: 30px; width: 22px; background: #ffe9c7;"></div>
                    <div class="drip" style="left: 180px; top: -8px; height: 22px; width: 16px; background: #ffdead;"></div>
                </div>

                <div class="layer layer-bottom" style="position: relative;">
                    <div class="drip" style="left: 25px; top: -8px; height: 34px; width: 22px; background: #ffe9c7;"></div>
                    <div class="drip" style="left: 80px; top: -8px; height: 26px; width: 20px; background: #ffdead;"></div>
                    <div class="drip" style="left: 140px; top: -8px; height: 32px; width: 24px; background: #ffe9c7;"></div>
                    <div class="drip" style="left: 200px; top: -8px; height: 28px; width: 20px; background: #ffdead;"></div>
                    <div class="drip" style="left: 250px; top: -8px; height: 24px; width: 18px; background: #ffe9c7;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Generate confetti particles
        function createConfetti() {
            const colors = ['#f1c40f', '#e74c3c', '#3498db', '#2ecc71', '#9b59b6', '#e67e22', '#1abc9c', '#e84393', '#f39c12'];
            const shapes = ['square', 'circle', 'rect'];
            
            for (let i = 0; i < 120; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                
                const size = Math.random() * 10 + 5;
                const color = colors[Math.floor(Math.random() * colors.length)];
                const shape = shapes[Math.floor(Math.random() * shapes.length)];
                const left = Math.random() * 100;
                const animationDuration = Math.random() * 3 + 3; // 3-6s
                const delay = Math.random() * 2;
                const opacity = Math.random() * 0.7 + 0.3;
                
                confetti.style.width = `${size}px`;
                confetti.style.height = `${size}px`;
                confetti.style.background = color;
                confetti.style.left = `${left}%`;
                confetti.style.opacity = opacity;
                confetti.style.animationDuration = `${animationDuration}s`;
                confetti.style.animationDelay = `${delay}s`;
                
                if (shape === 'circle') {
                    confetti.style.borderRadius = '50%';
                } else if (shape === 'rect') {
                    confetti.style.width = `${size * 0.6}px`;
                    confetti.style.height = `${size * 1.2}px`;
                }
                
                // Add a small rotation for variety
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                document.body.appendChild(confetti);
                
                // Remove after animation ends to keep DOM clean
                setTimeout(() => {
                    if (confetti.parentNode) {
                        confetti.remove();
                    }
                }, (animationDuration + delay) * 1000 + 500);
            }
        }

        // Start confetti after a short delay to let the main animation appear
        window.addEventListener('load', () => {
            setTimeout(() => {
                createConfetti();
            }, 800);
            
            // Optional: second burst after a few seconds
            setTimeout(() => {
                createConfetti();
            }, 3000);
        });

        // Add a little extra interactive glow: clicking anywhere makes a burst of confetti
        document.addEventListener('click', (e) => {
            // create a mini burst at click position
            const colors = ['#f1c40f', '#e74c3c', '#3498db', '#2ecc71', '#9b59b6', '#e67e22', '#1abc9c'];
            for (let i = 0; i < 15; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                const size = Math.random() * 8 + 4;
                confetti.style.width = `${size}px`;
                confetti.style.height = `${size}px`;
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = `${e.clientX}px`;
                confetti.style.top = `${e.clientY}px`;
                confetti.style.position = 'fixed';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                confetti.style.zIndex = '9999';
                confetti.style.animation = `fall ${Math.random() * 2 + 1.5}s linear forwards`;
                confetti.style.animationDelay = `${Math.random() * 0.3}s`;
                document.body.appendChild(confetti);
                
                setTimeout(() => {
                    if (confetti.parentNode) confetti.remove();
                }, 2500);
            }
        });

        // Pre-warm the animation by re-triggering a tiny flicker (optional)
        // just for fun, but everything is CSS driven.
    </script>
</body>
</html>
